const supabase = createClient(
  "https://kwcvhkpcprvnhmbqbqof.supabase.co",
  "sb_publishable_gNQosyu4VlClelMORr7JLA_Zi0opb-J"
);

window.storage = {
  async get(key, shared) {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) throw new Error("مفيش تسجيل دخول");
    const { data, error } = await supabase
      .from("nova_state")
      .select("value")
      .eq("user_id", user.id)
      .eq("key", key)
      .maybeSingle();
    if (error) throw error;
    if (!data) return null;
    return { key, value: JSON.stringify(data.value), shared: !!shared };
  },
  async set(key, value, shared) {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) throw new Error("مفيش تسجيل دخول");
    const parsed = JSON.parse(value);
    const { error } = await supabase
      .from("nova_state")
      .upsert({ user_id: user.id, key, value: parsed }, { onConflict: "user_id,key" });
    if (error) throw error;
    return { key, value, shared: !!shared };
  },
};

const pad2 = (n) => String(n).padStart(2, "0");
const toISO = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseISO = (dateStr) => {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d);
};
const todayISO = () => toISO(new Date());

function addDaysToISO(dateStr, n) {
  const d = parseISO(dateStr);
  d.setDate(d.getDate() + n);
  return toISO(d);
}

function addMonthToISO(dateStr) {
  const d = parseISO(dateStr);
  d.setMonth(d.getMonth() + 1);
  return toISO(d);
}

function dayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
}

function eightHourBlockIndex(d) {
  const blocksPerDay = 3; // 00:00, 08:00, 16:00
  return dayOfYear(d) * blocksPerDay + Math.floor(d.getHours() / 8);
}

function toMinutes(hhmm) {
  if (!hhmm) return null;
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}

function findConflicts(appointments, date, time, duration, excludeId) {
  const start = toMinutes(time);
  if (start == null || !date) return [];
  const end = start + (Number(duration) || 60);
  return appointments.filter((a) => {
    if (a.id === excludeId || a.date !== date) return false;
    const aStart = toMinutes(a.time);
    const aEnd = aStart + (Number(a.duration) || 60);
    return start < aEnd && aStart < end;
  });
}

function computeGrandTotal(accounts) {
  return accounts.reduce((sum, c) => sum + c.entries.reduce((s, e) => s + (e.type === "income" ? Number(e.amount) : -Number(e.amount)), 0), 0);
}

function monthlyTotals(accounts) {
  const map = {};
  accounts.forEach((cat) =>
    cat.entries.forEach((e) => {
      const month = e.date.slice(0, 7);
      const val = e.type === "income" ? Number(e.amount) : -Number(e.amount);
      map[month] = (map[month] || 0) + val;
    })
  );
  return Object.entries(map)
    .sort((a, b) => (a[0] < b[0] ? -1 : 1))
    .slice(-6)
    .map(([month, total]) => ({ month, total }));
}

/* ---------------- Appointment mini-form ---------------- */
function AppointmentForm({ appointments, initialTitle = "", initialDate = "", initialTime = "", onAdd, onCancel, compact = false }) {
  const [title, setTitle] = useState(initialTitle);
  const [date, setDate] = useState(initialDate);
  const [time, setTime] = useState(initialTime);
  const [duration, setDuration] = useState(60);
  const [confirming, setConfirming] = useState(false);

  const conflicts = useMemo(() => findConflicts(appointments, date, time, duration, null), [appointments, date, time, duration]);

  const submit = () => {
    if (!title.trim() || !date || !time) return;
    if (conflicts.length > 0 && !confirming) {
      setConfirming(true);
      return;
    }
    onAdd({ id: uid(), title: title.trim(), date, time, duration: Number(duration) || 60 });
    setConfirming(false);
    if (compact && onCancel) onCancel();
  };

  const inputCls = "bg-transparent border border-cyan-500/25 focus:border-cyan-400/60 outline-none px-2.5 py-1.5 text-sm text-slate-100 placeholder:text-slate-500";

  return (
    <div className="flex flex-col gap-2">
      <div className="flex flex-wrap gap-2 items-stretch">
        {!compact && (
          <input value={title} onChange={(e) => { setTitle(e.target.value); setConfirming(false); }} placeholder="عنوان الميعاد" className={`${inputCls} flex-1 min-w-[140px]`} style={{ clipPath: clip }} />
        )}
        <input type="date" value={date} onChange={(e) => { setDate(e.target.value); setConfirming(false); }} className={inputCls} style={{ clipPath: clip }} />
        <input type="time" value={time} onChange={(e) => { setTime(e.target.value); setConfirming(false); }} className={inputCls} style={{ clipPath: clip }} />
        <div className="flex items-center gap-1.5 border border-cyan-500/25 focus-within:border-cyan-400/60 px-2.5" style={{ clipPath: clip }}>
          <span className="text-[10px] text-slate-500 shrink-0">المدة</span>
          <input
            type="number"
            min="15"
            step="15"
            value={duration}
            onChange={(e) => { setDuration(e.target.value); setConfirming(false); }}
            className="w-12 bg-transparent outline-none text-sm text-slate-100 text-center py-1.5"
          />
          <span className="text-[10px] text-slate-500 shrink-0">دقيقة</span>
        </div>
        <button
          onClick={submit}
          className="flex items-center gap-1 px-3 py-1.5 text-sm border transition-colors"
          style={{
            clipPath: clip,
            borderColor: confirming ? "#fbbf24" : "rgba(34,211,238,0.5)",
            color: confirming ? "#fbbf24" : "#a5f3fc",
            background: confirming ? "rgba(251,191,36,0.1)" : "transparent",
          }}
        >
          <Plus size={14} /> {confirming ? "تأكيد رغم التعارض" : "إضافة للكاليندر"}
        </button>
        {compact && onCancel && (
          <button onClick={onCancel} className="text-slate-500 hover:text-slate-300 px-2">
            <X size={16} />
          </button>
        )}
      </div>
      {conflicts.length > 0 && (
        <div className="flex items-start gap-1.5 text-xs text-amber-300 border border-amber-500/30 bg-amber-500/10 px-2.5 py-1.5" style={{ clipPath: clip }}>
          <Bell size={13} className="mt-0.5 shrink-0" />
          <span>في تعارض مع: {conflicts.map((c) => `${c.title} (${c.time})`).join("، ")}</span>
        </div>
      )}
    </div>
  );
}

/* ---------------- Task item ---------------- */
function TaskItem({ task, project, appointments, onToggle, onDelete, onAiUpdate, onAddAppointment, selectMode, selected, onToggleSelect }) {
  const [scheduling, setScheduling] = useState(false);
  const p = PRIORITIES[task.priority];

  const runAI = async () => {
    onAiUpdate(task.id, { loading: true, error: null });
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [
            {
              role: "user",
              content: `أنت مساعد تنفيذي لمسوّق رقمي مصري بيشتغل في التسويق العقاري والدبلومات التدريبية والسوشيال ميديا. نفّذ المهمة دي فعليًا وقدّم مخرج جاهز للاستخدام مباشرة، مش شرح نظري.\n\nالمشروع: ${project.name}\nالمهمة: ${task.text}\n\nاكتب بالعربية المصرية، مباشر وعملي، ومنظم بنقاط أو خطوات واضحة لو يفيد المحتوى.`,
            },
          ],
        }),
      });
      if (!res.ok) throw new Error("bad_response");
      const data = await res.json();
      const out = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
      onAiUpdate(task.id, { loading: false, error: null, result: out || "مفيش رد.", open: true });
    } catch (e) {
      onAiUpdate(task.id, { loading: false, error: "حصل خطأ في التنفيذ — جرّب تاني." });
    }
  };

  return (
    <div className="border" style={{ borderColor: "rgba(148,163,184,0.15)", clipPath: clip, opacity: task.done ? 0.55 : 1 }}>
      <div className="flex items-center gap-3 px-3 py-2.5 group">
        {selectMode && (
          <button onClick={onToggleSelect} className="shrink-0">
            <div
              className="w-4 h-4 flex items-center justify-center"
              style={{ border: `1.5px solid ${selected ? "#a78bfa" : "rgba(148,163,184,0.4)"}`, background: selected ? "#a78bfa" : "transparent" }}
            >
              {selected && <CheckCircle2 size={12} className="text-slate-900" />}
            </div>
          </button>
        )}
        <button onClick={() => onToggle(task.id)} className="shrink-0">
          {task.done ? <CheckCircle2 size={18} className="text-cyan-400" /> : <Circle size={18} className="text-slate-500 hover:text-cyan-400" />}
        </button>
        <div className="flex-1 min-w-0">
          <div className={`text-sm text-slate-100 ${task.done ? "line-through" : ""}`}>{task.text}</div>
          {task.time && (
            <div className="text-[11px] text-slate-400 flex items-center gap-1 mt-0.5">
              <Clock3 size={11} /> {task.time}
            </div>
          )}
        </div>
        <span className="text-[10px] px-2 py-0.5 shrink-0" style={{ color: p.color, border: `1px solid ${p.color}55`, background: `${p.color}12` }}>
          {p.label}
        </span>
        <button
          onClick={runAI}
          disabled={task.ai?.loading}
          title="ينفذ الفكرة بالـ AI"
          className="shrink-0 flex items-center gap-1 text-[11px] px-2 py-1 border border-violet-400/40 text-violet-300 hover:bg-violet-400/10 transition-colors"
          style={{ clipPath: clip }}
        >
          {task.ai?.loading ? <Loader2 size={12} className="animate-spin" /> : <Sparkles size={12} />} نفّذ
        </button>
        <button
          onClick={() => setScheduling((s) => !s)}
          title="جدولة ميعاد"
          className="shrink-0 flex items-center gap-1 text-[11px] px-2 py-1 border border-cyan-400/40 text-cyan-300 hover:bg-cyan-400/10 transition-colors"
          style={{ clipPath: clip }}
        >
          <Calendar size={12} /> جدول
        </button>
        <button onClick={() => onDelete(task.id)} className="shrink-0 opacity-0 group-hover:opacity-100 transition-opacity text-slate-500 hover:text-rose-400">
          <Trash2 size={15} />
        </button>
      </div>

      {scheduling && (
        <div className="px-3 pb-3 pt-1 border-t" style={{ borderColor: "rgba(148,163,184,0.1)" }}>
          <AppointmentForm
            appointments={appointments}
            initialTitle={`${project.name} — ${task.text}`}
            initialDate={todayISO()}
            compact
            onCancel={() => setScheduling(false)}
            onAdd={(appt) => {
              onAddAppointment({ ...appt, projectName: project.name, taskId: task.id, source: "task" });
              setScheduling(false);
            }}
          />
        </div>
      )}

      {(task.ai?.result || task.ai?.error) && (
        <div className="px-3 pb-3 pt-1 border-t" style={{ borderColor: "rgba(148,163,184,0.1)" }}>
          {task.ai.error ? (
            <div className="text-xs text-rose-300">{task.ai.error}</div>
          ) : (
            <details open={task.ai.open}>
              <summary className="text-xs text-violet-300 cursor-pointer select-none">مخرج التنفيذ (AI)</summary>
              <div className="text-sm text-slate-200 whitespace-pre-wrap mt-2 leading-relaxed">{task.ai.result}</div>
            </details>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------------- Projects tab ---------------- */
function ProjectsTab({ projects, appointments, updateProjects, addAppointment }) {
  const [newProject, setNewProject] = useState("");
  const [openIds, setOpenIds] = useState({});
  const [draft, setDraft] = useState({});
  const [search, setSearch] = useState("");
  const [selectMode, setSelectMode] = useState({});
  const [selectedTasks, setSelectedTasks] = useState({});
  const [bulkAI, setBulkAI] = useState({});

  const addProject = () => {
    if (!newProject.trim()) return;
    const color = PROJECT_COLORS[projects.length % PROJECT_COLORS.length];
    updateProjects([...projects, { id: uid(), name: newProject.trim(), color, tasks: [] }]);
    setNewProject("");
  };

  const deleteProject = (id) => updateProjects(projects.filter((p) => p.id !== id));

  const addTask = (projectId) => {
    const d = draft[projectId] || {};
    if (!d.text?.trim()) return;
    updateProjects(
      projects.map((p) =>
        p.id === projectId
          ? { ...p, tasks: [...p.tasks, { id: uid(), text: d.text.trim(), priority: d.priority || "important", time: d.time || "", done: false, ai: null }] }
          : p
      )
    );
    setDraft({ ...draft, [projectId]: { text: "", priority: d.priority || "important", time: "" } });
  };

  const toggleTask = (projectId, taskId) => {
    updateProjects(projects.map((p) => (p.id === projectId ? { ...p, tasks: p.tasks.map((t) => (t.id === taskId ? { ...t, done: !t.done } : t)) } : p)));
  };

  const deleteTask = (projectId, taskId) => {
    updateProjects(projects.map((p) => (p.id === projectId ? { ...p, tasks: p.tasks.filter((t) => t.id !== taskId) } : p)));
  };

  const updateAI = (projectId, taskId, patch) => {
    updateProjects(projects.map((p) => (p.id === projectId ? { ...p, tasks: p.tasks.map((t) => (t.id === taskId ? { ...t, ai: { ...t.ai, ...patch } } : t)) } : p)));
  };

  const toggleSelectMode = (projectId) => {
    setSelectMode({ ...selectMode, [projectId]: !selectMode[projectId] });
    setSelectedTasks({ ...selectedTasks, [projectId]: new Set() });
    setBulkAI({ ...bulkAI, [projectId]: null });
  };

  const toggleTaskSelected = (projectId, taskId) => {
    const set = new Set(selectedTasks[projectId] || []);
    if (set.has(taskId)) set.delete(taskId);
    else set.add(taskId);
    setSelectedTasks({ ...selectedTasks, [projectId]: set });
  };

  const runBulkAI = async (project) => {
    const ids = Array.from(selectedTasks[project.id] || []);
    if (ids.length === 0) return;
    const tasksList = project.tasks.filter((t) => ids.includes(t.id));
    setBulkAI({ ...bulkAI, [project.id]: { loading: true, error: null, result: null } });
    try {
      const tasksText = tasksList.map((t, i) => `${i + 1}. ${t.text}`).join("\n");
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1500,
          messages: [
            {
              role: "user",
              content: `أنت مساعد تنفيذي لمسوّق رقمي مصري. نفّذ كل مهمة من المهام دي فعليًا وقدّم مخرج جاهز لكل واحدة تحت عنوان برقمها، مش شرح نظري.\n\nالمشروع: ${project.name}\nالمهام:\n${tasksText}\n\nاكتب بالعربية المصرية، مباشر وعملي.`,
            },
          ],
        }),
      });
      if (!res.ok) throw new Error("bad_response");
      const data = await res.json();
      const out = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
      setBulkAI((prev) => ({ ...prev, [project.id]: { loading: false, error: null, result: out || "مفيش رد." } }));
    } catch (e) {
      setBulkAI((prev) => ({ ...prev, [project.id]: { loading: false, error: "حصل خطأ في التنفيذ الجماعي — جرّب تاني." } }));
    }
  };

  return (
    <div className="flex flex-col gap-4">
      <Panel className="p-3">
        <CornerTicks />
        <div className="flex gap-2 mb-2">
          <input
            value={newProject}
            onChange={(e) => setNewProject(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addProject()}
            placeholder="اسم مشروع جديد... مثال: ARKAN"
            className="flex-1 bg-transparent border border-cyan-500/25 focus:border-cyan-400/60 outline-none px-3 py-2 text-sm placeholder:text-slate-500 text-slate-100"
            style={{ clipPath: clip }}
          />
          <button onClick={addProject} className="flex items-center gap-1.5 px-4 py-2 text-sm text-cyan-100 border border-cyan-400/50 hover:bg-cyan-400/10" style={{ clipPath: clip }}>
            <Plus size={15} /> مشروع
          </button>
        </div>
        <div className="flex items-center gap-2 border border-slate-700/60 px-2.5 py-1.5" style={{ clipPath: clip }}>
          <Search size={14} className="text-slate-500 shrink-0" />
          <input
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder="دور على تاسك أو مشروع..."
            className="flex-1 bg-transparent outline-none text-sm text-slate-100 placeholder:text-slate-500"
          />
          {search && (
            <button onClick={() => setSearch("")} className="text-slate-500 hover:text-slate-300 shrink-0">
              <X size={14} />
            </button>
          )}
        </div>
      </Panel>

      {projects.length === 0 && <div className="text-sm text-slate-500 text-center py-6">لسه مفيش مشاريع — ضيف أول واحد فوق.</div>}

      {projects
        .map((project) => {
          const q = search.trim();
          const matchesProject = !q || project.name.includes(q);
          const filteredTasks = q ? project.tasks.filter((t) => t.text.includes(q)) : project.tasks;
          return { project, matchesProject, filteredTasks };
        })
        .filter(({ matchesProject, filteredTasks }) => !search.trim() || matchesProject || filteredTasks.length > 0)
        .map(({ project, filteredTasks }) => {
          const open = openIds[project.id] ?? true;
          const d = draft[project.id] || { text: "", priority: "important", time: "" };
          const pendingCount = project.tasks.filter((t) => !t.done).length;
          const inSelectMode = !!selectMode[project.id];
          const selectedCount = (selectedTasks[project.id] || new Set()).size;
          const bulk = bulkAI[project.id];
          return (
            <Panel key={project.id} className="p-0 overflow-hidden">
              <CornerTicks />
              <button onClick={() => setOpenIds({ ...openIds, [project.id]: !open })} className="w-full flex items-center justify-between px-4 py-3">
                <div className="flex items-center gap-2">
                  {open ? <ChevronDown size={16} className="text-slate-400" /> : <ChevronRight size={16} className="text-slate-400" />}
                  <span className="w-2 h-2 rounded-full" style={{ background: project.color, boxShadow: `0 0 6px ${project.color}` }} />
                  <span className="text-sm font-medium text-slate-100">{project.name}</span>
                  <span className="text-[11px] text-slate-500">({pendingCount} معلقة)</span>
                </div>
                <div className="flex items-center gap-2">
                  <span
                    onClick={(e) => { e.stopPropagation(); toggleSelectMode(project.id); }}
                    className="flex items-center gap-1 text-[10px] px-2 py-1 border cursor-pointer"
                    style={{ clipPath: clip, borderColor: inSelectMode ? "#a78bfa" : "rgba(148,163,184,0.25)", color: inSelectMode ? "#a78bfa" : "#94a3b8" }}
                  >
                    <ListChecks size={11} /> تحديد جماعي
                  </span>
                  <span onClick={(e) => { e.stopPropagation(); deleteProject(project.id); }} className="text-slate-500 hover:text-rose-400 p-1">
                    <Trash2 size={14} />
                  </span>
                </div>
              </button>

              {open && (
                <div className="px-4 pb-4 flex flex-col gap-3">
                  {inSelectMode && (
                    <div className="flex flex-wrap items-center gap-2 border border-violet-400/30 bg-violet-400/5 px-3 py-2" style={{ clipPath: clip }}>
                      <span className="text-xs text-violet-300">محدد: {selectedCount}</span>
                      <button
                        onClick={() => runBulkAI(project)}
                        disabled={selectedCount === 0 || bulk?.loading}
                        className="flex items-center gap-1 text-xs px-3 py-1 border border-violet-400/50 text-violet-200 hover:bg-violet-400/10 disabled:opacity-40"
                        style={{ clipPath: clip }}
                      >
                        {bulk?.loading ? <Loader2 size={12} className="animate-spin" /> : <Sparkles size={12} />} نفّذ المحدد (AI)
                      </button>
                    </div>
                  )}
                  {bulk?.error && <div className="text-xs text-rose-300">{bulk.error}</div>}
                  {bulk?.result && (
                    <details open className="border border-violet-400/20 px-3 py-2" style={{ clipPath: clip }}>
                      <summary className="text-xs text-violet-300 cursor-pointer select-none">مخرج التنفيذ الجماعي (AI)</summary>
                      <div className="text-sm text-slate-200 whitespace-pre-wrap mt-2 leading-relaxed">{bulk.result}</div>
                    </details>
                  )}

                  <div className="flex flex-col sm:flex-row gap-2">
                    <input
                      value={d.text}
                      onChange={(e) => setDraft({ ...draft, [project.id]: { ...d, text: e.target.value } })}
                      onKeyDown={(e) => e.key === "Enter" && addTask(project.id)}
                      placeholder="مهمة جديدة في المشروع ده..."
                      className="flex-1 bg-transparent border border-cyan-500/25 focus:border-cyan-400/60 outline-none px-3 py-1.5 text-sm placeholder:text-slate-500 text-slate-100"
                      style={{ clipPath: clip }}
                    />
                    <div className="flex gap-1.5">
                      {Object.entries(PRIORITIES).map(([key, p]) => (
                        <button
                          key={key}
                          onClick={() => setDraft({ ...draft, [project.id]: { ...d, priority: key } })}
                          className="text-xs px-2.5 py-1 border"
                          style={{
                            borderColor: d.priority === key ? p.color : "rgba(148,163,184,0.25)",
                            color: d.priority === key ? p.color : "#94a3b8",
                            background: d.priority === key ? `${p.color}15` : "transparent",
                            clipPath: clip,
                          }}
                        >
                          {p.label}
                        </button>
                      ))}
                      <button onClick={() => addTask(project.id)} className="text-xs px-3 py-1 border border-cyan-400/50 text-cyan-200 hover:bg-cyan-400/10 flex items-center gap-1" style={{ clipPath: clip }}>
                        <Plus size={13} /> ضيف
                      </button>
                    </div>
                  </div>

                  <div className="flex flex-col gap-2">
                    {[...filteredTasks]
                      .sort((a, b) => (a.done !== b.done ? (a.done ? 1 : -1) : PRIORITIES[a.priority].order - PRIORITIES[b.priority].order))
                      .map((task) => (
                        <TaskItem
                          key={task.id}
                          task={task}
                          project={project}
                          appointments={appointments}
                          onToggle={(taskId) => toggleTask(project.id, taskId)}
                          onDelete={(taskId) => deleteTask(project.id, taskId)}
                          onAiUpdate={(taskId, patch) => updateAI(project.id, taskId, patch)}
                          onAddAppointment={addAppointment}
                          selectMode={inSelectMode}
                          selected={(selectedTasks[project.id] || new Set()).has(task.id)}
                          onToggleSelect={() => toggleTaskSelected(project.id, task.id)}
                        />
                      ))}
                    {filteredTasks.length === 0 && <div className="text-xs text-slate-500 py-2">{search.trim() ? "مفيش تاسكات مطابقة." : "مفيش مهام في المشروع ده لسه."}</div>}
                  </div>
                </div>
              )}
            </Panel>
          );
        })}
    </div>
  );
}

/* ---------------- Daily tab (habits + one-time items) ---------------- */
function last7Dates() {
  const arr = [];
  for (let i = 6; i >= 0; i--) arr.push(addDaysToISO(todayISO(), -i));
  return arr;
}

function computeStreak(history) {
  let streak = 0;
  let d = todayISO();
  while (history[d]) {
    streak++;
    d = addDaysToISO(d, -1);
  }
  return streak;
}

function HabitRow({ habit, onToggleToday, onDelete }) {
  const today = todayISO();
  const done = !!habit.history[today];
  const streak = computeStreak(habit.history);
  const days = last7Dates();
  const weekDayLetters = ["ح", "ن", "ث", "ر", "خ", "ج", "س"];

  return (
    <Panel className="p-3">
      <CornerTicks />
      <div className="flex items-center gap-3">
        <button onClick={onToggleToday} className="shrink-0">
          {done ? <CheckCircle2 size={22} className="text-emerald-400" /> : <Circle size={22} className="text-slate-500 hover:text-emerald-400" />}
        </button>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2">
            <span className="text-sm text-slate-100">{habit.name}</span>
            <span className="text-[9px] px-1.5 py-0.5 border border-cyan-400/30 text-cyan-300 shrink-0" style={{ clipPath: clip }}>عادة يومية</span>
          </div>
          <div className="flex items-center gap-1 mt-1.5">
            {days.map((d) => {
              const isToday = d === today;
              const doneDay = !!habit.history[d];
              return (
                <span
                  key={d}
                  title={d}
                  className="w-4 h-4 flex items-center justify-center text-[8px]"
                  style={{
                    clipPath: clip,
                    background: doneDay ? "rgba(52,211,153,0.7)" : "transparent",
                    border: `1px solid ${isToday ? "#22d3ee" : "rgba(148,163,184,0.25)"}`,
                    color: doneDay ? "#052e1f" : "#64748b",
                  }}
                >
                  {weekDayLetters[new Date(d).getDay()]}
                </span>
              );
            })}
          </div>
        </div>
        {streak > 0 && (
          <span className="flex items-center gap-1 text-xs text-amber-300 shrink-0">
            <Flame size={14} /> {streak}
          </span>
        )}
        <button onClick={onDelete} className="text-slate-500 hover:text-rose-400 shrink-0">
          <Trash2 size={15} />
        </button>
      </div>
    </Panel>
  );
}

function DailyTab({ daily, updateDaily }) {
  const [newItem, setNewItem] = useState("");
  const [newType, setNewType] = useState("habit");

  const addItem = () => {
    if (!newItem.trim()) return;
    if (newType === "habit") {
      updateDaily([...daily, { id: uid(), name: newItem.trim(), type: "habit", history: {} }]);
    } else {
      updateDaily([...daily, { id: uid(), name: newItem.trim(), type: "once", done: false, doneDate: null }]);
    }
    setNewItem("");
  };

  const toggleToday = (id) => {
    const today = todayISO();
    updateDaily(daily.map((h) => (h.id === id ? { ...h, history: { ...h.history, [today]: !h.history[today] } } : h)));
  };

  const toggleOnce = (id) => {
    updateDaily(daily.map((h) => (h.id === id ? { ...h, done: !h.done, doneDate: !h.done ? todayISO() : null } : h)));
  };

  const deleteItem = (id) => updateDaily(daily.filter((h) => h.id !== id));

  return (
    <div className="flex flex-col gap-3">
      <Panel className="p-3">
        <CornerTicks />
        <div className="flex flex-wrap gap-2">
          <input
            value={newItem}
            onChange={(e) => setNewItem(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addItem()}
            placeholder="عنصر جديد... مثال: وِرد الصبح، أو حجز الدومين"
            className="flex-1 min-w-[160px] bg-transparent border border-cyan-500/25 focus:border-cyan-400/60 outline-none px-3 py-2 text-sm placeholder:text-slate-500 text-slate-100"
            style={{ clipPath: clip }}
          />
          <div className="flex gap-1.5">
            <button
              onClick={() => setNewType("habit")}
              className="text-xs px-3 py-2 border flex items-center gap-1"
              style={{
                clipPath: clip,
                borderColor: newType === "habit" ? "#22d3ee" : "rgba(148,163,184,0.25)",
                color: newType === "habit" ? "#22d3ee" : "#94a3b8",
                background: newType === "habit" ? "rgba(34,211,238,0.1)" : "transparent",
              }}
            >
              <Sun size={12} /> عادة يومية
            </button>
            <button
              onClick={() => setNewType("once")}
              className="text-xs px-3 py-2 border flex items-center gap-1"
              style={{
                clipPath: clip,
                borderColor: newType === "once" ? "#a78bfa" : "rgba(148,163,184,0.25)",
                color: newType === "once" ? "#a78bfa" : "#94a3b8",
                background: newType === "once" ? "rgba(167,139,250,0.1)" : "transparent",
              }}
            >
              لمرة واحدة
            </button>
            <button onClick={addItem} className="flex items-center gap-1.5 px-4 py-2 text-sm text-cyan-100 border border-cyan-400/50 hover:bg-cyan-400/10" style={{ clipPath: clip }}>
              <Plus size={15} /> ضيف
            </button>
          </div>
        </div>
      </Panel>
      {daily.length === 0 && <div className="text-sm text-slate-500 text-center py-6">لسه مفيش عناصر مسجلة — ضيف أول واحد فوق وحدد نوعه.</div>}
      {daily.map((item) =>
        item.type === "once" ? (
          <OnceRow key={item.id} item={item} onToggle={() => toggleOnce(item.id)} onDelete={() => deleteItem(item.id)} />
        ) : (
          <HabitRow key={item.id} habit={item} onToggleToday={() => toggleToday(item.id)} onDelete={() => deleteItem(item.id)} />
        )
      )}
    </div>
  );
}

/* ---------------- Calendar tab ---------------- */
function CalendarTab({ appointments, addAppointment, deleteAppointment }) {
  const [monthDate, setMonthDate] = useState(new Date());
  const [selectedDay, setSelectedDay] = useState(todayISO());

  const year = monthDate.getFullYear();
  const month = monthDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const dateStr = (d) => `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  const countFor = (d) => appointments.filter((a) => a.date === dateStr(d)).length;

  const dayAppointments = useMemo(
    () => appointments.filter((a) => a.date === selectedDay).sort((a, b) => toMinutes(a.time) - toMinutes(b.time)),
    [appointments, selectedDay]
  );

  const weekDays = ["أحد", "اثنين", "ثلاثاء", "أربعاء", "خميس", "جمعة", "سبت"];
  const monthLabel = monthDate.toLocaleDateString("ar-EG", { month: "long", year: "numeric" });

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <Panel className="p-3 lg:col-span-2">
        <CornerTicks />
        <div className="flex items-center justify-between mb-3">
          <button onClick={() => setMonthDate(new Date(year, month - 1, 1))} className="text-slate-400 hover:text-cyan-300 p-1">
            <ChevronRight size={16} />
          </button>
          <div className="text-sm text-cyan-100 font-medium">{monthLabel}</div>
          <button onClick={() => setMonthDate(new Date(year, month + 1, 1))} className="text-slate-400 hover:text-cyan-300 p-1">
            <ChevronLeft size={16} />
          </button>
        </div>
        <div className="grid grid-cols-7 gap-1 text-center mb-1.5">
          {weekDays.map((w) => (
            <div key={w} className="text-[10px] text-slate-500">{w}</div>
          ))}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map((d, i) => {
            if (d === null) return <div key={i} />;
            const ds = dateStr(d);
            const count = countFor(d);
            const isToday = ds === todayISO();
            const isSelected = ds === selectedDay;
            return (
              <button
                key={i}
                onClick={() => setSelectedDay(ds)}
                className="h-8 sm:h-9 flex flex-col items-center justify-center border text-[11px] relative"
                style={{
                  clipPath: clip,
                  borderColor: isSelected ? "#22d3ee" : isToday ? "rgba(251,191,36,0.5)" : "rgba(148,163,184,0.15)",
                  background: isSelected ? "rgba(34,211,238,0.12)" : "transparent",
                  color: isToday ? "#fbbf24" : "#cbd5e1",
                }}
              >
                {d}
                {count > 0 && <span className="absolute bottom-0.5 w-1 h-1 rounded-full bg-cyan-400" style={{ boxShadow: "0 0 4px #22d3ee" }} />}
              </button>
            );
          })}
        </div>
      </Panel>

      <div className="flex flex-col gap-4">
        <Panel className="p-4">
          <CornerTicks />
          <div className="text-xs tracking-wide text-slate-400 mb-3">
            مواعيد يوم {new Date(selectedDay).toLocaleDateString("ar-EG", { day: "numeric", month: "long" })}
          </div>
          {dayAppointments.length === 0 ? (
            <div className="text-xs text-slate-500 mb-3">مفيش مواعيد في اليوم ده.</div>
          ) : (
            <div className="flex flex-col gap-2 mb-3">
              {dayAppointments.map((a) => (
                <div key={a.id} className="flex items-center gap-2 text-sm border px-2.5 py-1.5" style={{ borderColor: "rgba(148,163,184,0.15)", clipPath: clip }}>
                  <Clock3 size={13} className="text-cyan-400 shrink-0" />
                  <span className="text-slate-400 text-xs font-mono">{a.time}</span>
                  <span className="flex-1 text-slate-100 truncate">{a.title}</span>
                  {a.projectName && <span className="text-[10px] text-slate-500 shrink-0">{a.projectName}</span>}
                  <button onClick={() => deleteAppointment(a.id)} className="text-slate-500 hover:text-rose-400 shrink-0">
                    <Trash2 size={13} />
                  </button>
                </div>
              ))}
            </div>
          )}
          <AppointmentForm appointments={appointments} initialDate={selectedDay} onAdd={addAppointment} />
        </Panel>
      </div>
    </div>
  );
}

function CoursesTab({ courses, appointments, updateCourses, addAppointment, deleteAppointment, addAccountEntry, removeAccountEntry }) {
  const [newCourse, setNewCourse] = useState("");
  const [newPrice, setNewPrice] = useState("");
  const [newType, setNewType] = useState("group");
  const [newSessions, setNewSessions] = useState(8);
  const [priceError, setPriceError] = useState(false);

  const addCourse = () => {
    const priceNum = Number(newPrice);
    if (!newCourse.trim() || !newPrice || priceNum <= 0) {
      setPriceError(true);
      return;
    }
    const count = Math.max(1, Number(newSessions) || 1);
    const lectures = Array.from({ length: count }, () => ({ title: "", description: "", notes: "", done: false, date: "", time: "", apptId: null }));
    updateCourses([...courses, { id: uid(), name: newCourse.trim(), price: priceNum, type: newType, done: false, accountEntryId: null, lectures }]);
    setNewCourse("");
    setNewPrice("");
    setNewSessions(8);
    setPriceError(false);
  };

  const moveCourse = (id, direction) => {
    const activeIds = courses.filter((c) => !c.done).map((c) => c.id);
    const pos = activeIds.indexOf(id);
    const swapPos = direction === "up" ? pos - 1 : pos + 1;
    if (swapPos < 0 || swapPos >= activeIds.length) return;
    const otherId = activeIds[swapPos];
    const idxA = courses.findIndex((c) => c.id === id);
    const idxB = courses.findIndex((c) => c.id === otherId);
    const next = [...courses];
    [next[idxA], next[idxB]] = [next[idxB], next[idxA]];
    updateCourses(next);
  };

  const activeCourses = courses.filter((c) => !c.done);
  const doneCourses = courses.filter((c) => c.done);

  const renderCourse = (course, withMove) => {
    const activeIds = activeCourses.map((c) => c.id);
    const pos = activeIds.indexOf(course.id);
    return (
      <CourseCard
        key={course.id}
        course={course}
        appointments={appointments}
        addAppointment={addAppointment}
        deleteAppointment={deleteAppointment}
        addAccountEntry={addAccountEntry}
        removeAccountEntry={removeAccountEntry}
        onUpdate={(updated) => updateCourses(courses.map((c) => (c.id === course.id ? updated : c)))}
        onDelete={(id) => updateCourses(courses.filter((c) => c.id !== id))}
        onMoveUp={withMove ? () => moveCourse(course.id, "up") : undefined}
        onMoveDown={withMove ? () => moveCourse(course.id, "down") : undefined}
        canMoveUp={withMove ? pos > 0 : false}
        canMoveDown={withMove ? pos < activeIds.length - 1 : false}
      />
    );
  };

  return (
    <div className="flex flex-col gap-4">
      <Panel className="p-3">
        <CornerTicks />
        <div className="flex flex-wrap gap-2 items-stretch">
          <input
            value={newCourse}
            onChange={(e) => setNewCourse(e.target.value)}
            placeholder="اسم كورس/دبلومة جديدة... مثال: دبلومة التسويق العقاري"
            className="flex-1 min-w-[180px] bg-transparent border border-cyan-500/25 focus:border-cyan-400/60 outline-none px-3 py-2 text-sm placeholder:text-slate-500 text-slate-100"
            style={{ clipPath: clip }}
          />
          <input
            value={newPrice}
            onChange={(e) => { setNewPrice(e.target.value); setPriceError(false); }}
            type="number"
            placeholder="السعر (مطلوب)"
            className="w-32 bg-transparent border outline-none px-3 py-2 text-sm placeholder:text-slate-500 text-slate-100"
            style={{ clipPath: clip, borderColor: priceError ? "#fb7185" : "rgba(34,211,238,0.25)" }}
          />
          <div className="flex items-center gap-1.5 border border-cyan-500/25 px-2.5" style={{ clipPath: clip }}>
            <span className="text-[10px] text-slate-500 shrink-0">السيشنز</span>
            <input
              value={newSessions}
              onChange={(e) => setNewSessions(e.target.value)}
              type="number"
              min="1"
              className="w-12 bg-transparent outline-none text-sm text-slate-100 text-center py-2"
            />
          </div>
          <div className="flex gap-1.5">
            <button
              onClick={() => setNewType("group")}
              className="text-xs px-3 py-2 border flex items-center gap-1"
              style={{ clipPath: clip, borderColor: newType === "group" ? "#60a5fa" : "rgba(148,163,184,0.25)", color: newType === "group" ? "#60a5fa" : "#94a3b8", background: newType === "group" ? "rgba(96,165,250,0.1)" : "transparent" }}
            >
              <Users size={12} /> جروب
            </button>
            <button
              onClick={() => setNewType("private")}
              className="text-xs px-3 py-2 border flex items-center gap-1"
              style={{ clipPath: clip, borderColor: newType === "private" ? "#a78bfa" : "rgba(148,163,184,0.25)", color: newType === "private" ? "#a78bfa" : "#94a3b8", background: newType === "private" ? "rgba(167,139,250,0.1)" : "transparent" }}
            >
              <User size={12} /> برايفيت
            </button>
          </div>
          <button onClick={addCourse} className="flex items-center gap-1.5 px-4 py-2 text-sm text-cyan-100 border border-cyan-400/50 hover:bg-cyan-400/10" style={{ clipPath: clip }}>
            <Plus size={15} /> كورس
          </button>
        </div>
        {priceError && <div className="text-xs text-rose-300 mt-2">لازم تحط سعر الكورس عشان تقدر تضيفه.</div>}
      </Panel>

      {courses.length === 0 && <div className="text-sm text-slate-500 text-center py-6">لسه مفيش كورسات — ضيف أول واحد فوق.</div>}

      {activeCourses.map((course) => renderCourse(course, true))}

      {doneCourses.length > 0 && (
        <>
          <div className="flex items-center gap-2 mt-2 mb-1">
            <div className="h-px flex-1 bg-slate-700/50" />
            <span className="text-xs text-emerald-400 flex items-center gap-1">
              <CheckCircle2 size={13} /> كورسات خلصت ({doneCourses.length})
            </span>
            <div className="h-px flex-1 bg-slate-700/50" />
          </div>
          {doneCourses.map((course) => renderCourse(course, false))}
        </>
      )}
    </div>
  );
}

function CommitmentsPanel({ commitments, updateCommitments, addAccountEntry, removeAccountEntry }) {
  const [open, setOpen] = useState(false);
  const [name, setName] = useState("");
  const [amount, setAmount] = useState("");
  const [dueDate, setDueDate] = useState("");
  const [recurring, setRecurring] = useState(false);
  const [payingId, setPayingId] = useState(null);
  const [payWallet, setPayWallet] = useState(DEFAULT_WALLET);
  const today = todayISO();

  const addCommitment = () => {
    if (!name.trim() || !amount || !dueDate) return;
    updateCommitments([...commitments, { id: uid(), name: name.trim(), amount: Number(amount), dueDate, paid: false, paidEntryId: null, recurring }]);
    setName("");
    setAmount("");
    setDueDate("");
    setRecurring(false);
  };

  const startPaying = (c) => {
    setPayWallet(DEFAULT_WALLET);
    setPayingId(c.id);
  };

  const confirmPay = (c) => {
    const entry = { id: uid(), description: c.name, amount: Number(c.amount), type: "expense", date: today, wallet: payWallet };
    addAccountEntry("التزامات", entry);
    let next = commitments.map((x) => (x.id === c.id ? { ...x, paid: true, paidEntryId: entry.id } : x));
    if (c.recurring) {
      next = [...next, { id: uid(), name: c.name, amount: c.amount, dueDate: addMonthToISO(c.dueDate), paid: false, paidEntryId: null, recurring: true }];
    }
    updateCommitments(next);
    setPayingId(null);
  };

  const undoPay = (c) => {
    if (c.paidEntryId) removeAccountEntry("التزامات", c.paidEntryId);
    updateCommitments(commitments.map((x) => (x.id === c.id ? { ...x, paid: false, paidEntryId: null } : x)));
  };

  const sorted = [...commitments].sort((a, b) => (a.dueDate < b.dueDate ? -1 : 1));

  return (
    <Panel className="p-4">
      <CornerTicks />
      <button onClick={() => setOpen((o) => !o)} className="w-full flex items-center justify-between gap-2 mb-1">
        <span className="flex items-center gap-2 text-xs tracking-wide text-slate-400">
          {open ? <ChevronDown size={14} className="text-slate-400" /> : <ChevronRight size={14} className="text-slate-400" />}
          الالتزامات — أقساط ودفعات مستحقة
        </span>
        <span className="text-[11px] text-slate-500">{commitments.filter((c) => !c.paid).length} معلقة</span>
      </button>

      {open && (
      <>
      <div className="flex flex-col gap-2 mb-3 mt-2">
        {sorted.length === 0 && <div className="text-xs text-slate-500">مفيش التزامات مسجلة.</div>}
        {sorted.map((c) => {
          const overdue = !c.paid && c.dueDate < today;
          const soon = !c.paid && !overdue && c.dueDate <= addDaysToISO(today, 3);
          return (
            <div key={c.id} className="flex flex-col gap-1.5">
              <div
                className="flex items-center gap-2 text-sm border px-2.5 py-1.5"
                style={{
                  borderColor: overdue ? "rgba(251,113,133,0.4)" : soon ? "rgba(251,191,36,0.4)" : "rgba(148,163,184,0.15)",
                  clipPath: clip,
                  opacity: c.paid ? 0.5 : 1,
                }}
              >
                <button onClick={() => (c.paid ? undoPay(c) : startPaying(c))} className="shrink-0">
                  {c.paid ? <CheckCircle2 size={16} className="text-emerald-400" /> : <Circle size={16} className="text-slate-500 hover:text-emerald-400" />}
                </button>
                <span className={`flex-1 text-slate-100 truncate ${c.paid ? "line-through" : ""}`}>{c.name}</span>
                {c.recurring && <Repeat size={12} className="text-cyan-400 shrink-0" />}
                {overdue && <AlertTriangle size={13} className="text-rose-400 shrink-0" />}
                <span className="text-[11px] font-mono shrink-0" style={{ color: overdue ? "#fb7185" : soon ? "#fbbf24" : "#94a3b8" }}>
                  {c.dueDate}
                </span>
                <span className="text-sm font-mono text-slate-200 shrink-0">{Number(c.amount).toLocaleString("ar-EG")}</span>
                <button onClick={() => updateCommitments(commitments.filter((x) => x.id !== c.id))} className="text-slate-500 hover:text-rose-400 shrink-0">
                  <Trash2 size={13} />
                </button>
              </div>
              {payingId === c.id && (
                <div className="flex flex-wrap items-center gap-1.5 border border-emerald-400/25 bg-emerald-400/5 px-2.5 py-2" style={{ clipPath: clip }}>
                  <span className="text-[10px] text-slate-400 shrink-0">اتدفعت من:</span>
                  {WALLETS.map((w) => (
                    <button
                      key={w.key}
                      onClick={() => setPayWallet(w.key)}
                      className="text-xs px-2.5 py-1 border"
                      style={{ clipPath: clip, borderColor: payWallet === w.key ? w.color : "rgba(148,163,184,0.25)", color: payWallet === w.key ? w.color : "#94a3b8", background: payWallet === w.key ? `${w.color}15` : "transparent" }}
                    >
                      {w.label}
                    </button>
                  ))}
                  <button onClick={() => confirmPay(c)} className="flex items-center gap-1 text-xs px-3 py-1 border border-emerald-400/50 text-emerald-200 hover:bg-emerald-400/10" style={{ clipPath: clip }}>
                    <CheckCircle2 size={12} /> تأكيد الدفع
                  </button>
                  <button onClick={() => setPayingId(null)} className="text-xs px-2.5 py-1 border border-slate-600 text-slate-400 hover:bg-slate-800" style={{ clipPath: clip }}>
                    إلغاء
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>
      <div className="flex flex-wrap gap-2">
        <input
          value={name}
          onChange={(e) => setName(e.target.value)}
          placeholder="اسم الالتزام (قسط، إيجار، اشتراك...)"
          className="flex-1 min-w-[160px] bg-transparent border border-cyan-500/25 focus:border-cyan-400/60 outline-none px-2.5 py-1.5 text-sm text-slate-100 placeholder:text-slate-500"
          style={{ clipPath: clip }}
        />
        <input
          value={amount}
          onChange={(e) => setAmount(e.target.value)}
          type="number"
          placeholder="المبلغ"
          className="w-28 bg-transparent border border-cyan-500/25 focus:border-cyan-400/60 outline-none px-2.5 py-1.5 text-sm text-slate-100 placeholder:text-slate-500"
          style={{ clipPath: clip }}
        />
        <input type="date" value={dueDate} onChange={(e) => setDueDate(e.target.value)} className="bg-transparent border border-cyan-500/25 focus:border-cyan-400/60 outline-none px-2.5 py-1.5 text-sm text-slate-100" style={{ clipPath: clip }} />
        <button
          onClick={() => setRecurring((r) => !r)}
          className="flex items-center gap-1 text-xs px-2.5 py-1.5 border"
          style={{ clipPath: clip, borderColor: recurring ? "#22d3ee" : "rgba(148,163,184,0.25)", color: recurring ? "#22d3ee" : "#94a3b8", background: recurring ? "rgba(34,211,238,0.1)" : "transparent" }}
        >
          <Repeat size={12} /> شهري متكرر
        </button>
        <button onClick={addCommitment} className="text-xs px-3 py-1.5 border border-cyan-400/50 text-cyan-200 hover:bg-cyan-400/10 flex items-center gap-1" style={{ clipPath: clip }}>
          <Plus size={13} /> ضيف
        </button>
      </div>
      </>
      )}
    </Panel>
  );
}

  const allEntries = [];
  accounts.forEach((cat) =>
    cat.entries.forEach((e) => {
      const key = balances[e.wallet] !== undefined ? e.wallet : DEFAULT_WALLET;
      balances[key] += e.type === "income" ? Number(e.amount) : -Number(e.amount);
      allEntries.push({ ...e, wallet: key, categoryName: cat.name });
    })
  );

  const selectedEntries = selected
    ? allEntries.filter((e) => e.wallet === selected).sort((a, b) => (a.date < b.date ? 1 : -1))

  return (
    <Panel className="p-4">
      <CornerTicks />

      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
        {WALLETS.map((w) => (
          <button
            key={w.key}
            onClick={() => setSelected(selected === w.key ? null : w.key)}

            style={{
              borderColor: selected === w.key ? w.color : `${w.color}40`,
              clipPath: clip,
              background: selected === w.key ? `${w.color}18` : `${w.color}0a`,
            }}
          >
            <div className="text-[11px] text-slate-400 mb-1">{w.label}</div>
            <div className="text-lg font-mono" style={{ color: balances[w.key] >= 0 ? w.color : "#fb7185" }}>
              {balances[w.key].toLocaleString("ar-EG")}
            </div>
          </button>
        ))}
      </div>

      {selected && (
        <div className="mt-3 pt-3 border-t flex flex-col gap-1.5" style={{ borderColor: "rgba(148,163,184,0.15)" }}>
          <div className="text-xs text-slate-400 mb-1">عمليات {walletLabel(selected)}</div>
          {selectedEntries.length === 0 ? (
            <div className="text-xs text-slate-500">مفيش عمليات مسجلة على الخزنة دي لسه.</div>

            selectedEntries.map((e) => (
              <div key={e.id} className="flex items-center gap-2 text-sm border px-2.5 py-1.5" style={{ borderColor: "rgba(148,163,184,0.15)", clipPath: clip }}>
                <span className="text-[10px] text-slate-500 font-mono shrink-0">{e.date}</span>

  return (

          ) : (
            <span className="text-xs text-slate-400">متبقي {daysLeft} يوم</span>
          )}

function WorkoutTab({ workout, updateWorkout }) {
  const today = todayISO();
  const selections = workout.selections || {};
  const doneToday = workout.doneDate === today;

  useEffect(() => {
    if (workout.planDate !== today) {
      const nextSelections = {};
      WORKOUT_SLOTS.forEach((slot) => {
        const poolLen = EXERCISE_POOL[slot.key].length;
        const cur = (workout.selections || {})[slot.key] || 0;
        nextSelections[slot.key] = poolLen > 1 ? (cur + 1) % poolLen : 0;
      });
      updateWorkout({ ...workout, selections: nextSelections, planDate: today });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [workout.planDate]);

  const swap = (slotKey) => {
    const pool = EXERCISE_POOL[slotKey];
    const current = selections[slotKey] || 0;
    const next = (current + 1) % pool.length;
    updateWorkout({ ...workout, selections: { ...selections, [slotKey]: next } });
  };

  const toggleDone = () => {
    updateWorkout({ ...workout, doneDate: doneToday ? "" : today });
  };

  const swapAll = () => {
    const nextSelections = {};
    WORKOUT_SLOTS.forEach((slot) => {
      const poolLen = EXERCISE_POOL[slot.key].length;
      const cur = selections[slot.key] || 0;
      nextSelections[slot.key] = poolLen > 1 ? (cur + 1) % poolLen : 0;
    });
    updateWorkout({ ...workout, selections: nextSelections });
  };

  return (
    <div className="flex flex-col gap-4">
      <Panel className="p-4" glow>
        <CornerTicks />
        <div className="flex items-center justify-between gap-3 flex-wrap">
          <div className="flex items-center gap-2">

/* ---------------- Backup panel ---------------- */
function BackupPanel() {
  const [exportText, setExportText] = useState("");
  const [importText, setImportText] = useState("");
  const [status, setStatus] = useState("");
  const [copied, setCopied] = useState(false);
  const [busy, setBusy] = useState(false);

  const doExport = async () => {
    setBusy(true);
    setStatus("جاري تجميع البيانات...");
    const data = {};
    for (const [name, key] of Object.entries(KEYS)) {
      try {
        const r = await window.storage.get(key, false);
        data[name] = r ? JSON.parse(r.value) : null;
      } catch (e) {
        data[name] = null;
      }
    }
    const payload = { exportedAt: new Date().toISOString(), app: "NOVA", data };
    setExportText(JSON.stringify(payload));
    setStatus("جاهز — دوس \"نسخ\" وابعت النص هنا في الشات عشان أرفعه في جوجل درايف بتاعك.");
    setBusy(false);
  };

  const copyExport = async () => {
    try {
      await navigator.clipboard.writeText(exportText);
      setCopied(true);
      setTimeout(() => setCopied(false), 2500);
    } catch (e) {
      setStatus("متقدرش أنسخ تلقائي — حدد النص من الصندوق وانسخه يدوي (Ctrl/Cmd+C).");
    }
  };

  const doImport = async () => {
    setBusy(true);
    try {
      const parsed = JSON.parse(importText);
      const data = parsed.data || parsed;
      for (const [name, key] of Object.entries(KEYS)) {
        if (data[name] !== undefined && data[name] !== null) {
          await window.storage.set(key, JSON.stringify(data[name]), false);
        }
      }
      setStatus("تم الاسترجاع — الصفحة هتتحدّث دلوقتي...");
      setTimeout(() => window.location.reload(), 1200);
    } catch (e) {
      setStatus("النص مش صالح — تأكد إنك لاصق نسخة احتياطية سليمة اتصدرت من نفس الأداة.");
    }
    setBusy(false);
  };

  return (
    <Panel className="p-4">
      <CornerTicks />
      <div className="text-xs tracking-wide text-slate-400 mb-3">نسخة احتياطية — تصدير واسترجاع</div>

      <div className="flex flex-wrap items-center gap-2 mb-2">
        <button
          onClick={doExport}
          disabled={busy}
          className="flex items-center gap-1.5 text-xs px-3 py-1.5 border border-cyan-400/50 text-cyan-200 hover:bg-cyan-400/10 disabled:opacity-50"
          style={{ clipPath: clip }}
        >
          {busy ? <Loader2 size={13} className="animate-spin" /> : <Download size={13} />} تصدير كل البيانات
        </button>
        {exportText && (
          <button onClick={copyExport} className="flex items-center gap-1.5 text-xs px-3 py-1.5 border border-emerald-400/50 text-emerald-200 hover:bg-emerald-400/10" style={{ clipPath: clip }}>
            {copied ? "اتنسخ ✅" : "نسخ النص"}
          </button>
        )}
      </div>

      {exportText && (
        <textarea
          readOnly
          value={exportText}
          rows={3}
          className="w-full bg-transparent border border-slate-700 text-[10px] font-mono text-slate-400 p-2 mb-2"
          style={{ clipPath: clip }}
          onFocus={(e) => e.target.select()}
        />
      )}

      {status && <div className="text-xs text-cyan-300 mb-2">{status}</div>}

      <div className="mt-2 pt-3 border-t" style={{ borderColor: "rgba(148,163,184,0.15)" }}>
        <div className="text-xs text-slate-500 mb-1.5">استرجاع من نسخة قديمة:</div>
        <textarea
          value={importText}
          onChange={(e) => setImportText(e.target.value)}
          placeholder="الصق هنا نص نسخة احتياطية سابقة..."
          rows={2}
          className="w-full bg-transparent border border-slate-700 text-xs text-slate-300 placeholder:text-slate-600 p-2 mb-2"
          style={{ clipPath: clip }}
        />
        <button
          onClick={doImport}
          disabled={!importText.trim() || busy}
          className="flex items-center gap-1.5 text-xs px-3 py-1.5 border border-amber-400/50 text-amber-200 hover:bg-amber-400/10 disabled:opacity-40"
          style={{ clipPath: clip }}
        >
          <Upload size={13} /> استيراد واسترجاع
        </button>
      </div>
    </Panel>
  );
}

          <div className="flex flex-col gap-1.5">
            {todayAppts.slice(0, 5).map((a) => (
              <div key={a.id} className="text-sm text-slate-200 truncate">🕐 {a.time} — {a.title}</div>
            ))}
          </div>
        )}
      </Panel>

      <Panel className="p-4" onClick={() => onGo("daily")}>
        <CornerTicks />
        <div className="flex items-center justify-between mb-2">
          <span className="text-xs tracking-wide text-slate-400">عادات لسه ماخلصتهاش النهاردة</span>
          <span className="text-lg font-mono text-amber-300">{pendingHabits.length}</span>
        </div>
        {pendingHabits.length === 0 ? (
          <div className="text-xs text-slate-500">كل عاداتك النهاردة خلصت. 🔥</div>
        ) : (
          <div className="flex flex-col gap-1.5">
            {pendingHabits.map((h) => (
              <div key={h.id} className="text-sm text-slate-200 truncate">• {h.name}</div>
            ))}
          </div>
        )}
      </Panel>

      <Panel className="p-4" onClick={() => onGo("accounts")}>
        <CornerTicks />
        <div className="flex items-center justify-between mb-2">
          <span className="text-xs tracking-wide text-slate-400">صافي الحسابات</span>
          <span className="text-lg font-mono" style={{ color: grandTotal >= 0 ? "#34d399" : "#fb7185" }}>{grandTotal.toLocaleString("ar-EG")}</span>
        </div>
        {(overdueCommitments.length > 0 || dueSoonCommitments.length > 0) ? (
          <div className="flex flex-col gap-1">
            {overdueCommitments.length > 0 && <div className="text-xs text-rose-300 flex items-center gap-1"><AlertTriangle size={12} /> {overdueCommitments.length} التزام فات ميعاده</div>}
            {dueSoonCommitments.length > 0 && <div className="text-xs text-amber-300">{dueSoonCommitments.length} التزام مستحق قريب</div>}
          </div>
        ) : (
          <div className="text-xs text-slate-500">مفيش التزامات مستعجلة.</div>
        )}
      </Panel>

      <Panel className="p-4 md:col-span-2" onClick={() => onGo("goals")}>
        <CornerTicks />
        <div className="flex items-center justify-between mb-2">
          <span className="text-xs tracking-wide text-slate-400">أهداف نشطة</span>
          <span className="text-lg font-mono text-cyan-300">{activeGoals.length}</span>
        </div>
        {activeGoals.length === 0 ? (
          <div className="text-xs text-slate-500 mb-3">مفيش أهداف نشطة دلوقتي.</div>
        ) : (
          <div className="flex flex-col gap-1.5 mb-3">
            {activeGoals.slice(0, 4).map((g) => (
              <div key={g.id} className="flex items-center gap-2 text-sm text-slate-200">
                <span className="flex-1 truncate">• {g.title}</span>
                <span className="text-xs text-slate-500 font-mono">{g.progress}%</span>
              </div>
            ))}
          </div>
        )}
      </Panel>

      <Panel className="p-4 md:col-span-2" onClick={() => onGo("courses")}>
        <CornerTicks />
        <div className="flex items-center justify-between mb-2">
          <span className="text-xs tracking-wide text-slate-400">كورسات قربت تخلص (75%+)</span>
          <span className="text-lg font-mono text-emerald-300">{nearDoneCourses.length}</span>
        </div>
        {nearDoneCourses.length === 0 ? (
          <div className="text-xs text-slate-500">مفيش كورسات قربت تخلص دلوقتي.</div>
        ) : (
          <div className="flex flex-col gap-1.5">
            {nearDoneCourses.map((c) => {
              const doneCount = c.lectures.filter((l) => l.done).length;
              return <div key={c.id} className="text-sm text-slate-200">• {c.name} ({doneCount}/{c.lectures.length})</div>;
            })}
          </div>
        )}
      </Panel>
      </div>
      <BackupPanel />
    </div>
  );
}

/* ---------------- App ---------------- */
function App() {
  const [tab, setTab] = useState("dashboard");
  const [projects, setProjects] = useState([]);
  const [appointments, setAppointments] = useState([]);
  const [courses, setCourses] = useState([]);
  const [accounts, setAccounts] = useState([]);
  const [daily, setDaily] = useState([]);
  const [commitments, setCommitments] = useState([]);
  const [goals, setGoals] = useState([]);
  const [topThree, setTopThree] = useState({ date: "", items: [] });
  const [workout, setWorkout] = useState({ selections: {}, doneDate: "", planDate: "" });
  const [novaTasks, setNovaTasks] = useState({ prime: [], marketing: [] });
  const [loaded, setLoaded] = useState(false);
  const [saveError, setSaveError] = useState(false);
  const [now, setNow] = useState(new Date());
  const debounceRef = useRef({});

  useEffect(() => {
    try { document.title = "NOVA"; } catch (e) { /* sandboxed, ignore */ }
  }, []);

  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    (async () => {
      const loadOne = async (key, setter) => {
        try {
          const r = await window.storage.get(key, false);
          if (r && r.value) setter(JSON.parse(r.value));
        } catch (e) {
          /* nothing saved yet */
        }
      };
      await Promise.all([
        loadOne(KEYS.projects, setProjects),
        loadOne(KEYS.appointments, setAppointments),
        loadOne(KEYS.courses, setCourses),
        loadOne(KEYS.accounts, setAccounts),
        loadOne(KEYS.daily, setDaily),
        loadOne(KEYS.commitments, setCommitments),
        loadOne(KEYS.goals, setGoals),
        loadOne(KEYS.topThree, setTopThree),
        loadOne(KEYS.workout, setWorkout),
        loadOne(KEYS.novaTasks, setNovaTasks),
      ]);
      setLoaded(true);
    })();
  }, []);

  const persist = useCallback((key, value, debounceMs = 0) => {
    const doSave = async () => {
      try {
        const r = await window.storage.set(key, JSON.stringify(value), false);
        setSaveError(!r);
      } catch (e) {
        setSaveError(true);
      }
    };
    if (!debounceMs) return doSave();
    clearTimeout(debounceRef.current[key]);
    debounceRef.current[key] = setTimeout(doSave, debounceMs);
  }, []);

  const updateProjects = (next) => { setProjects(next); persist(KEYS.projects, next); };
  const updateCourses = (next) => { setCourses(next); persist(KEYS.courses, next, 400); };
  const updateAccounts = (next) => { setAccounts(next); persist(KEYS.accounts, next); };
  const updateDaily = (next) => { setDaily(next); persist(KEYS.daily, next); };
  const updateCommitments = (next) => { setCommitments(next); persist(KEYS.commitments, next); };
  const updateGoals = (next) => { setGoals(next); persist(KEYS.goals, next, 300); };
  const updateTopThree = (next) => { setTopThree(next); persist(KEYS.topThree, next, 300); };
  const updateWorkout = (next) => { setWorkout(next); persist(KEYS.workout, next); };
  const updateNovaTasks = (next) => { setNovaTasks(next); persist(KEYS.novaTasks, next, 300); };
  const addAppointment = (appt) => { setAppointments((prev) => { const next = [...prev, appt]; persist(KEYS.appointments, next); return next; }); };
  const deleteAppointment = (id) => { setAppointments((prev) => { const next = prev.filter((a) => a.id !== id); persist(KEYS.appointments, next); return next; }); };

  const addAccountEntry = (categoryName, entry) => {
    setAccounts((prev) => {
      const exists = prev.find((c) => c.name === categoryName);
      const withCat = exists ? prev : [...prev, { id: uid(), name: categoryName, entries: [] }];
      const next = withCat.map((c) => (c.name === categoryName ? { ...c, entries: [...c.entries, entry] } : c));
      persist(KEYS.accounts, next);
      return next;
    });
  };

  const removeAccountEntry = (categoryName, entryId) => {
    setAccounts((prev) => {
      const next = prev.map((c) => (c.name === categoryName ? { ...c, entries: c.entries.filter((e) => e.id !== entryId) } : c));
      persist(KEYS.accounts, next);
      return next;
    });
  };

  const dateStr = now.toLocaleDateString("ar-EG", { weekday: "long", day: "numeric", month: "long" });
  const timeStr = now.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const todayCount = appointments.filter((a) => a.date === todayISO()).length;
  const quote = QUOTES[eightHourBlockIndex(now) % QUOTES.length];

  const overdueCommitmentsCount = commitments.filter((c) => !c.paid && c.dueDate < todayISO()).length;
  const dueTodayCommitmentsCount = commitments.filter((c) => !c.paid && c.dueDate === todayISO()).length;

  return (
    <div
      dir="rtl"
      className="min-h-screen w-full font-sans text-slate-200 p-4 md:p-6"
      style={{
        background:
          "radial-gradient(ellipse at top, rgba(34,211,238,0.06), transparent 60%), " +
          "linear-gradient(rgba(34,211,238,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,0.035) 1px, transparent 1px), #050b13",
        backgroundSize: "auto, 34px 34px, 34px 34px, auto",
      }}
    >
      <style>{`
        @keyframes nova-glow-pulse {
          0%, 100% { opacity: 0.15; transform: scale(0.85); }
          50% { opacity: 0.7; transform: scale(1.35); }
        }
        @keyframes nova-core-flicker {
          0%, 100% { box-shadow: 0 0 10px rgba(34,211,238,0.3); }
          50% { box-shadow: 0 0 22px rgba(34,211,238,0.65); }
        }
      `}</style>
      <Panel className="p-4 md:p-5 mb-4" glow>
        <CornerTicks />
        <div className="flex flex-wrap items-center justify-between gap-3">
          <div className="flex items-center gap-3">
            <div className="relative flex items-center justify-center w-14 h-14 shrink-0">
              <span className="absolute inset-0 rounded-full" style={{ border: "1px solid rgba(34,211,238,0.25)" }} />
              <span className="absolute inset-[2px] rounded-full" style={{ border: "1px solid #22d3ee", animation: "nova-glow-pulse 4s ease-in-out infinite" }} />
              <div
                className="relative w-8 h-8 rounded-full flex items-center justify-center"
                style={{ background: "rgba(34,211,238,0.12)", animation: "nova-core-flicker 4s ease-in-out infinite" }}
              >
                <Zap size={16} className="text-cyan-300" style={{ filter: "drop-shadow(0 0 4px #22d3ee)" }} />
              </div>
            </div>
            <div>
              <div className="flex items-baseline gap-2 flex-wrap">
                <span className="text-2xl font-bold tracking-[0.25em] text-cyan-100" style={{ textShadow: "0 0 18px rgba(34,211,238,0.45)" }}>
                  NOVA
                </span>
              </div>
              <div className="text-sm text-cyan-200/80 mt-0.5">أهلاً يا فهد</div>
              <div className="text-[11px] text-amber-300/90 italic mt-0.5">{quote}</div>
              <div className="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
                <Radio size={11} className="text-emerald-400" /> {todayCount > 0 ? `عندك ${todayCount} ميعاد النهاردة` : "مفيش مواعيد النهاردة"}
              </div>
              <button
                onClick={() => setTab("workout")}
                className="text-xs flex items-center gap-1.5 mt-1 hover:underline"
                style={{ color: workout.doneDate === todayISO() ? "#34d399" : "#fbbf24" }}
              >
                <Dumbbell size={11} />
                {workout.doneDate === todayISO() ? "خلصت تمرين النهاردة ✅" : "تمرين النهاردة لسه — Workout (20 دقيقة)"}
              </button>
            </div>
          </div>
          <div className="text-left shrink-0">
            <div className="text-2xl font-mono tabular-nums text-cyan-200">{timeStr}</div>
            <div className="text-xs text-slate-400">{dateStr}</div>
          </div>
        </div>
        {(overdueCommitmentsCount > 0 || dueTodayCommitmentsCount > 0) && (
          <div
            className="mt-3 flex items-center gap-1.5 text-xs px-2.5 py-1.5 border"
            style={{
              clipPath: clip,
              borderColor: overdueCommitmentsCount > 0 ? "rgba(251,113,133,0.4)" : "rgba(251,191,36,0.4)",
              color: overdueCommitmentsCount > 0 ? "#fb7185" : "#fbbf24",
              background: overdueCommitmentsCount > 0 ? "rgba(251,113,133,0.08)" : "rgba(251,191,36,0.08)",
            }}
          >
            <AlertTriangle size={13} />
            {overdueCommitmentsCount > 0
              ? `عندك ${overdueCommitmentsCount} التزام فات ميعاده — راجع تاب الحسابات`
              : `عندك ${dueTodayCommitmentsCount} التزام مستحق النهاردة`}
          </div>
        )}
      </Panel>

      {saveError && (
        <div className="mb-4 text-xs text-rose-300 border border-rose-500/30 bg-rose-500/10 px-3 py-2" style={{ clipPath: clip }}>
          حصل خطأ في الحفظ — التعديل اتسجل بس ممكن يضيع لو قفلت الصفحة.
        </div>
      )}

      <div className="flex gap-2 mb-4 flex-wrap">
        <TabButton active={tab === "dashboard"} onClick={() => setTab("dashboard")} icon={LayoutDashboard} label="الرئيسية" />
        <TabButton active={tab === "projects"} onClick={() => setTab("projects")} icon={Folder} label="المشاريع" />
        <TabButton active={tab === "daily"} onClick={() => setTab("daily")} icon={Sun} label="يومي" />
        <TabButton active={tab === "calendar"} onClick={() => setTab("calendar")} icon={Calendar} label="الكاليندر" />
        <TabButton active={tab === "courses"} onClick={() => setTab("courses")} icon={BookOpen} label="الكورسات" />
        <TabButton active={tab === "goals"} onClick={() => setTab("goals")} icon={Target} label="الأهداف" />
        <TabButton active={tab === "accounts"} onClick={() => setTab("accounts")} icon={Wallet} label="الحسابات" />
        <TabButton active={tab === "workout"} onClick={() => setTab("workout")} icon={Dumbbell} label="Workout" />
        <TabButton active={tab === "nova"} onClick={() => setTab("nova")} icon={Briefcase} label="NOVA" />
      </div>

      {!loaded ? (
        <div className="flex items-center gap-2 text-sm text-slate-400 py-10 justify-center">
          <Loader2 size={16} className="animate-spin" /> NOVA بتشغل الأنظمة...
        </div>
      ) : (
        <>
          {tab === "dashboard" && (
            <DashboardTab
              projects={projects}
              appointments={appointments}
              daily={daily}
              accounts={accounts}
              courses={courses}
              commitments={commitments}
              goals={goals}
              top3={topThree}
              updateTop3={updateTopThree}
              onGo={setTab}
            />
          )}
          {tab === "goals" && <GoalsTab goals={goals} updateGoals={updateGoals} />}
          {tab === "projects" && <ProjectsTab projects={projects} appointments={appointments} updateProjects={updateProjects} addAppointment={addAppointment} />}
          {tab === "daily" && <DailyTab daily={daily} updateDaily={updateDaily} />}
          {tab === "calendar" && <CalendarTab appointments={appointments} addAppointment={addAppointment} deleteAppointment={deleteAppointment} />}
          {tab === "courses" && (
            <CoursesTab
              courses={courses}
              appointments={appointments}
              updateCourses={updateCourses}
              addAppointment={addAppointment}
              deleteAppointment={deleteAppointment}
              addAccountEntry={addAccountEntry}
              removeAccountEntry={removeAccountEntry}
            />
          )}
          {tab === "accounts" && (
            <AccountsTab
              accounts={accounts}
              updateAccounts={updateAccounts}
              commitments={commitments}
              updateCommitments={updateCommitments}
              addAccountEntry={addAccountEntry}
              removeAccountEntry={removeAccountEntry}
            />
          )}
          {tab === "workout" && <WorkoutTab workout={workout} updateWorkout={updateWorkout} />}
          {tab === "nova" && (
            <NovaTab
              accounts={accounts}
              addAccountEntry={addAccountEntry}
              removeAccountEntry={removeAccountEntry}
              novaTasks={novaTasks}
              updateNovaTasks={updateNovaTasks}
            />
          )}
        </>
      )}

      <div className="text-center text-[11px] text-slate-600 mt-6 tracking-wide">
        NOVA — نظام فهد الشخصي. كل حاجة بتتحفظ تلقائي وبتتزامن مع الكاليندر والحسابات.
      </div>
    </div>
  );
}

/* ---------------- Auth gate ---------------- */
function AuthGate() {
  const [session, setSession] = useState(undefined); // undefined = still checking
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = supabase.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  const submit = async () => {
    setBusy(true);
    setError("");
    setNotice("");
    try {
      if (mode === "signin") {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        setNotice("اتسجل الحساب. لو الإيميل محتاج تأكيد هتلاقي رسالة في بريدك، أكّده وبعدين سجّل دخول.");
      }
    } catch (e) {
      setError(e.message || "حصل خطأ، جرّب تاني.");
    }
    setBusy(false);
  };

  const clipStyle = "polygon(0 8px, 8px 0, 100% 0, 100% 100%, 0 100%)";

  if (session === undefined) {
    return (
      <div dir="rtl" style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#050b13", color: "#94a3b8" }}>
        <Loader2 size={20} className="animate-spin" />
      </div>
    );
  }

  if (session) {
    return (
      <>
        <button
          onClick={() => supabase.auth.signOut()}
          className="fixed top-3 left-3 z-50 flex items-center gap-1.5 text-xs px-3 py-1.5 border border-slate-600 text-slate-300 hover:bg-slate-800"
          style={{ clipPath: clipStyle, background: "#0a1420" }}
        >
          <LogOut size={13} /> خروج
        </button>
        <App />
      </>
    );
  }

  return (
    <div dir="rtl" className="min-h-screen w-full font-sans flex items-center justify-center p-4" style={{ background: "radial-gradient(ellipse at top, rgba(34,211,238,0.06), transparent 60%), #050b13" }}>
      <div className="w-full max-w-sm relative border p-6" style={{ background: "linear-gradient(180deg, rgba(10,20,32,0.9), rgba(6,13,22,0.9))", borderColor: "rgba(34,211,238,0.35)", clipPath: "polygon(0 10px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%)", boxShadow: "0 0 24px rgba(34,211,238,0.12)" }}>
        <div className="text-center mb-6">
          <div className="text-2xl font-bold tracking-[0.25em] text-cyan-100" style={{ textShadow: "0 0 18px rgba(34,211,238,0.45)" }}>NOVA</div>
          <div className="text-xs text-slate-500 mt-1">{mode === "signin" ? "تسجيل الدخول" : "حساب جديد"}</div>
        </div>

        <div className="flex flex-col gap-3">
          <div className="flex items-center gap-2 border border-cyan-500/25 focus-within:border-cyan-400/60 px-3 py-2" style={{ clipPath: clipStyle }}>
            <Mail size={14} className="text-slate-500 shrink-0" />
            <input
              type="email"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="الإيميل"
              className="flex-1 bg-transparent outline-none text-sm text-slate-100 placeholder:text-slate-500"
            />
          </div>
          <div className="flex items-center gap-2 border border-cyan-500/25 focus-within:border-cyan-400/60 px-3 py-2" style={{ clipPath: clipStyle }}>
            <Lock size={14} className="text-slate-500 shrink-0" />
            <input
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="كلمة السر"
              onKeyDown={(e) => e.key === "Enter" && submit()}
              className="flex-1 bg-transparent outline-none text-sm text-slate-100 placeholder:text-slate-500"
            />
          </div>

          {error && <div className="text-xs text-rose-300 border border-rose-500/30 bg-rose-500/10 px-3 py-2" style={{ clipPath: clipStyle }}>{error}</div>}
          {notice && <div className="text-xs text-cyan-300 border border-cyan-500/30 bg-cyan-500/10 px-3 py-2" style={{ clipPath: clipStyle }}>{notice}</div>}

          <button
            onClick={submit}
            disabled={busy || !email || !password}
            className="flex items-center justify-center gap-2 text-sm px-4 py-2.5 border border-cyan-400/50 text-cyan-100 hover:bg-cyan-400/10 disabled:opacity-40"
            style={{ clipPath: clipStyle }}
          >
            {busy ? <Loader2 size={15} className="animate-spin" /> : <Zap size={15} />}
            {mode === "signin" ? "دخول" : "إنشاء الحساب"}
          </button>

          <button
            onClick={() => { setMode(mode === "signin" ? "signup" : "signin"); setError(""); setNotice(""); }}
            className="text-xs text-slate-400 hover:text-cyan-300 text-center mt-1"
          >
            {mode === "signin" ? "معندكش حساب؟ اعمل واحد" : "عندك حساب؟ سجّل دخول"}
          </button>
        </div>
      </div>
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<AuthGate />);
</script>
